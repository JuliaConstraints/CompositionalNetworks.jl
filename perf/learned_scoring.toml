schema_version = "perfchecker-scenario-catalog/1"
root = ".."

[[scenarios]]
id = "learned-pair-counts"
source = "learned_scoring.jl"
factory = "LearnedScoringCases.pair_counts"
implementation = "compiled"
collectors = ["benchmark", "chairmark", "profile", "profile_alloc"]
[scenarios.parameters]
witness = 2
n = 1000
method = "compiled"

[[scenarios]]
id = "learned-pair-counts"
source = "learned_scoring.jl"
factory = "LearnedScoringCases.pair_counts"
implementation = "original-square"
collectors = ["benchmark", "chairmark"]
[scenarios.parameters]
witness = 2
n = 1000
method = "square"
